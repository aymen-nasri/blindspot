  <text x="34" y="352" font-size="12" font-weight="600" fill="#b1281f">Missed</text>
  <text x="178" y="352" font-size="10.5" font-weight="700" text-anchor="end" fill="#2147b0">FIXED</text>
  <rect x="196" y="310" width="164" height="58" rx="6" fill="#ffffff" stroke="#b1281f" stroke-width="1.5"/>
  <text x="206" y="331" font-size="13" font-weight="600" fill="#14202e">NetworkPolicy block</text>
  <text x="206" y="352" font-size="12" font-weight="600" fill="#b1281f">Missed</text>
  <text x="350" y="352" font-size="10.5" font-weight="700" text-anchor="end" fill="#2147b0">FIXED</text>
  <rect x="368" y="310" width="164" height="58" rx="6" fill="#f4ecd0" stroke="#8f6c00" stroke-width="1.5" stroke-dasharray="5 3"/>
