  <text x="378" y="182" font-size="12" font-weight="600" fill="#1d7a4c">Caught, ~16 min</text>
  <text x="24" y="234" font-size="14" font-weight="700" fill="#14202e">Harder infrastructure failures</text>
  <text x="876" y="234" font-size="13" text-anchor="end" fill="#5a6577">kind · 1 of 10 caught</text>
  <rect x="24" y="244" width="164" height="58" rx="6" fill="#dcefe4" stroke="#1d7a4c" stroke-width="1.5"/>
  <text x="34" y="265" font-size="13" font-weight="600" fill="#14202e">App keeps crashing</text>
  <text x="34" y="286" font-size="12" font-weight="600" fill="#1d7a4c">Caught, ~16 min</text>
  <rect x="196" y="244" width="164" height="58" rx="6" fill="#f8e7d3" stroke="#b45f08" stroke-width="1.5"/>
  <text x="206" y="265" font-size="13" font-weight="600" fill="#14202e">CPU throttled</text>
  <text x="206" y="286" font-size="12" font-weight="600" fill="#b45f08">Fired, muted</text>
  <text x="350" y="286" font-size="10.5" font-weight="700" text-anchor="end" fill="#2147b0">FIXED</text>
  <rect x="368" y="244" width="164" height="58" rx="6" fill="#ffffff" stroke="#b1281f" stroke-width="1.5"/>
  <text x="378" y="265" font-size="13" font-weight="600" fill="#14202e">DNS returns NXDOMAIN</text>
  <text x="378" y="286" font-size="12" font-weight="600" fill="#b1281f">Missed</text>
  <text x="522" y="286" font-size="10.5" font-weight="700" text-anchor="end" fill="#2147b0">FIXED</text>
  <rect x="540" y="244" width="164" height="58" rx="6" fill="#ffffff" stroke="#b1281f" stroke-width="1.5"/>
