<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 498" width="900" height="498" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Default alerts caught 7 of 18 real Kubernetes failures (5 trials each, a fresh cluster every trial)">
  <rect width="900" height="498" rx="10" fill="#ffffff"/>
  <text x="24" y="40" font-size="17" font-weight="700" fill="#14202e">Default alerts caught 7 of 18 real Kubernetes failures (5 trials each, a fresh cluster every trial)</text>
  <rect x="24" y="57" width="14" height="14" rx="3" fill="#dcefe4" stroke="#1d7a4c" stroke-width="1.5"/>
  <text x="44" y="68" font-size="12.5" fill="#5a6577">Caught: an alert was delivered</text>
  <rect x="264.0" y="57" width="14" height="14" rx="3" fill="#f8e7d3" stroke="#b45f08" stroke-width="1.5"/>
  <text x="284.0" y="68" font-size="12.5" fill="#5a6577">Fired, reached nobody</text>
  <rect x="444.6" y="57" width="14" height="14" rx="3" fill="#f4ecd0" stroke="#8f6c00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="464.6" y="68" font-size="12.5" fill="#5a6577">Started waiting, never fired</text>
  <rect x="671.4" y="57" width="14" height="14" rx="3" fill="#ffffff" stroke="#b1281f" stroke-width="1.5"/>
  <text x="691.4" y="68" font-size="12.5" fill="#5a6577">Missed: nothing happened</text>
  <text x="24" y="90" font-size="12.5" fill="#2147b0" font-weight="600">FIXED: caught in at least 4 of 5 trials once BlindSpot’s 5 proposed rules were added</text>
  <text x="24" y="130" font-size="14" font-weight="700" fill="#14202e">Common app failures</text>
  <text x="876" y="130" font-size="13" text-anchor="end" fill="#5a6577">kind · 3 of 3 caught</text>
  <rect x="24" y="140" width="164" height="58" rx="6" fill="#dcefe4" stroke="#1d7a4c" stroke-width="1.5"/>
  <text x="34" y="161" font-size="13" font-weight="600" fill="#14202e">Out of memory</text>
