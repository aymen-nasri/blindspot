  <text x="378" y="352" font-size="12" font-weight="600" fill="#8f6c00">Waited, never fired</text>
  <text x="522" y="352" font-size="10.5" font-weight="700" text-anchor="end" fill="#2147b0">FIXED</text>
  <rect x="540" y="310" width="164" height="58" rx="6" fill="#f8e7d3" stroke="#b45f08" stroke-width="1.5"/>
  <text x="550" y="331" font-size="13" font-weight="600" fill="#14202e">Alertmanager down</text>
  <text x="550" y="352" font-size="12" font-weight="600" fill="#b45f08">Fired, reached nobody</text>
  <rect x="712" y="310" width="164" height="58" rx="6" fill="#ffffff" stroke="#b1281f" stroke-width="1.5"/>
  <text x="722" y="331" font-size="13" font-weight="600" fill="#14202e">Prometheus down</text>
  <text x="722" y="352" font-size="12" font-weight="600" fill="#b1281f">Missed</text>
  <text x="24" y="404" font-size="14" font-weight="700" fill="#14202e">Node failures on real VMs</text>
  <text x="876" y="404" font-size="13" text-anchor="end" fill="#5a6577">3 KVM VMs · 3 of 5 caught</text>
  <rect x="24" y="414" width="164" height="58" rx="6" fill="#dcefe4" stroke="#1d7a4c" stroke-width="1.5"/>
  <text x="34" y="435" font-size="13" font-weight="600" fill="#14202e">Node disk full</text>
  <text x="34" y="456" font-size="12" font-weight="600" fill="#1d7a4c">Caught, ~16 min</text>
  <rect x="196" y="414" width="164" height="58" rx="6" fill="#dcefe4" stroke="#1d7a4c" stroke-width="1.5"/>
  <text x="206" y="435" font-size="13" font-weight="600" fill="#14202e">Node out of inodes</text>
  <text x="206" y="456" font-size="12" font-weight="600" fill="#1d7a4c">Caught, ~16 min</text>
  <rect x="368" y="414" width="164" height="58" rx="6" fill="#f4ecd0" stroke="#8f6c00" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="378" y="435" font-size="13" font-weight="600" fill="#14202e">Node memory pressure</text>
  <text x="378" y="456" font-size="12" font-weight="600" fill="#8f6c00">Waited, never fired</text>
  <rect x="540" y="414" width="164" height="58" rx="6" fill="#dcefe4" stroke="#1d7a4c" stroke-width="1.5"/>
  <text x="550" y="435" font-size="13" font-weight="600" fill="#14202e">Kubelet stopped</text>
  <text x="550" y="456" font-size="12" font-weight="600" fill="#1d7a4c">Caught, ~10 min</text>
  <rect x="712" y="414" width="164" height="58" rx="6" fill="#f8e7d3" stroke="#b45f08" stroke-width="1.5"/>
  <text x="722" y="435" font-size="13" font-weight="600" fill="#14202e">containerd, then a crash</text>
