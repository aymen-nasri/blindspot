  <text x="206" y="182" font-size="12" font-weight="600" fill="#1d7a4c">Caught, ~16 min</text>
  <rect x="368" y="140" width="164" height="58" rx="6" fill="#dcefe4" stroke="#1d7a4c" stroke-width="1.5"/>
