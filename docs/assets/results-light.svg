  <text x="550" y="286" font-size="12" font-weight="600" fill="#b1281f">Missed</text>
  <text x="694" y="286" font-size="10.5" font-weight="700" text-anchor="end" fill="#2147b0">FIXED</text>
  <rect x="712" y="244" width="164" height="58" rx="6" fill="#f4ecd0" stroke="#8f6c00" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="722" y="265" font-size="13" font-weight="600" fill="#14202e">40% packet loss</text>
  <text x="722" y="286" font-size="12" font-weight="600" fill="#8f6c00">Waited, never fired</text>
  <text x="866" y="286" font-size="10.5" font-weight="700" text-anchor="end" fill="#2147b0">FIXED</text>
  <rect x="24" y="310" width="164" height="58" rx="6" fill="#ffffff" stroke="#b1281f" stroke-width="1.5"/>
