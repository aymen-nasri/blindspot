name: release

# Builds the package, makes an SBOM of exactly what it installs, signs every file with Cosign (keyless,
# through GitHub's OIDC identity, so there's no key to leak), and verifies the signatures. On a version
# tag it publishes a GitHub release with all of it. Run by hand, it only builds, signs and verifies.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # to publish the release
      id-token: write # for keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the package
        run: |
          python3 -m pip install --quiet build==1.6.1
          python3 -m build --outdir dist .

      - name: Make an SBOM of what the package installs
        run: |
          curl -fsSLo trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  trivy.tgz" | sha256sum -c
          tar xzf trivy.tgz trivy
          python3 -m venv /tmp/env
          /tmp/env/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/lock
          /tmp/env/bin/pip freeze --exclude blindspot > /tmp/lock/requirements.txt
          ./trivy fs --format cyclonedx --output dist/blindspot-sbom.cdx.json /tmp/lock

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign every file, keyless
        run: |
          for file in dist/*; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done

      - name: Verify every signature against this workflow's identity
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          for file in dist/*.whl dist/*.tar.gz dist/*.cdx.json; do
            cosign verify-blob --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$file"
          done
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "BlindSpot $TAG" --notes-file "docs/releases/$TAG.md"
