name: trial

# Runs trials: one job and one fresh kind cluster for each fault and trial number. Results come back as
# artifacts and a summary table, and get committed to results/ by hand afterwards.
# Only people with write access can start it, so trials never run from forks.
on:
  workflow_dispatch:
    inputs:
      faults:
        description: JSON list of fault ids (see `blindspot faults list`)
        default: '["positive-crashloop","negative-quiet","harm-noop","delivery-off"]'
      trials:
        description: Trials per fault, each on its own fresh cluster
        default: "1"
      lab:
        description: kind, or vm for real VMs (node faults)
        type: choice
        options: [kind, vm]
        default: kind
      profile:
        description: a for the chart's defaults, c for the defaults plus BlindSpot's fixes
        type: choice
        options: [a, c]
        default: a

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      faults: ${{ steps.plan.outputs.faults }}
      trials: ${{ steps.plan.outputs.trials }}
    steps:
      - id: plan
        name: Check the inputs and list the trials
        env:
          FAULTS: ${{ inputs.faults }}
          TRIALS: ${{ inputs.trials }}
        run: |
          echo "$FAULTS" | jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[a-z0-9-]+$"))' \
            || { echo "faults must be a JSON list of fault ids"; exit 1; }
          [[ "$TRIALS" =~ ^[1-9]$|^10$ ]] || { echo "trials must be 1 to 10"; exit 1; }
          echo "faults=$(echo "$FAULTS" | jq -c .)" >> "$GITHUB_OUTPUT"
          echo "trials=$(jq -nc --argjson n "$TRIALS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  trial:
    needs: plan
    name: ${{ matrix.fault }} ${{ matrix.trial }}
    runs-on: ubuntu-24.04
    # The longest window is 75 minutes, plus up to 15 to build the lab and 10 to wait and baseline.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The free plan runs 20 jobs at once. Leaving 4 free means CI and Pages never wait hours behind trials.
      max-parallel: 16
      matrix:
        fault: ${{ fromJSON(needs.plan.outputs.faults) }}
        trial: ${{ fromJSON(needs.plan.outputs.trials) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kind and Helm, checking their checksums
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c
          sudo install kind /usr/local/bin/kind
          curl -fsSLo helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          echo "896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea  helm.tgz" | sha256sum -c
          tar xzf helm.tgz linux-amd64/helm
          sudo install linux-amd64/helm /usr/local/bin/helm

      - name: Let this job use KVM, and install the VM lab's tools
        if: inputs.lab == 'vm'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils libvirt-daemon-system virtinst dnsmasq-base xorriso
          python3 -m pip install --quiet ansible-core==2.21.6

      - name: Install BlindSpot
        run: python3 -m pip install --quiet .

      - name: Check before breaking anything
        env:
          LAB: ${{ inputs.lab }}
        run: blindspot --lab-type "$LAB" doctor

      - name: Run one trial
        env:
          FAULT: ${{ matrix.fault }}
          TRIAL: ${{ matrix.trial }}
          LAB: ${{ inputs.lab }}
          PROFILE: ${{ inputs.profile }}
        # A folder of its own, so the artifact holds this trial's result and not the committed ones.
        run: blindspot --lab-type "$LAB" --profile "$PROFILE" run --fault "$FAULT" --trial "$TRIAL" --out trial-out

      - name: Save the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ matrix.fault }}-${{ matrix.trial }}
          path: trial-out/
          if-no-files-found: warn

  summary:
    needs: [plan, trial]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: run-results
      - name: Summarise
        env:
          FAULTS: ${{ needs.plan.outputs.faults }}
          TRIALS: ${{ inputs.trials }}
        run: |
          python3 -m pip install --quiet .
          blindspot score run-results --expect-trials "$TRIALS" --expect-faults "$FAULTS" | tee -a "$GITHUB_STEP_SUMMARY"
