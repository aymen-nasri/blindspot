name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: python3 -m pip install --quiet . ruff==0.17.3 pytest==9.1.1 ansible-core==2.21.6
      - name: Lint
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .
      - name: Test
        run: python3 -m pytest -q
      - name: Fault files load
        run: blindspot faults list
      - name: Results page builds
        run: blindspot report results --out site
      - name: VM lab playbook and scripts parse
        run: |
          (cd vmlab/ansible && ansible-playbook -i localhost, --syntax-check site.yml)
          bash -n vmlab/up.sh vmlab/finish.sh
