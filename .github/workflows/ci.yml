name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: python3 -m pip install --quiet . ruff==0.17.3 pytest==9.1.1 ansible-core==2.21.6
      - name: Lint
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .
      - name: Test
        run: python3 -m pytest -q
      - name: Fault files load
        run: blindspot faults list
      - name: Results page builds
        run: blindspot report results --out site
      - name: Proposed rules pass promtool and pint
        run: |
          curl -fsSLo prom.tgz https://github.com/prometheus/prometheus/releases/download/v3.16.0/prometheus-3.16.0.linux-amd64.tar.gz
          echo "68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34  prom.tgz" | sha256sum -c
          tar xzf prom.tgz --strip-components=1 prometheus-3.16.0.linux-amd64/promtool
          curl -fsSLo pint.tgz https://github.com/cloudflare/pint/releases/download/v0.89.4/pint-0.89.4-linux-amd64.tar.gz
          echo "5077e58cc66e40dc60991a3604ee62752b7377a5251cd78745fbe657d5a5ebc9  pint.tgz" | sha256sum -c
          tar xzf pint.tgz pint-linux-amd64
          ./promtool check rules rules/blindspot.rules.yml
          ./promtool test rules rules/tests/blindspot.test.yml
          ./pint-linux-amd64 lint rules/blindspot.rules.yml
      - name: VM lab playbook and scripts parse
        run: |
          (cd vmlab/ansible && ansible-playbook -i localhost, --syntax-check site.yml)
          bash -n vmlab/up.sh vmlab/finish.sh
