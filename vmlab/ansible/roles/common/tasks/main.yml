- name: Wait for cloud-init, which holds the apt lock while it runs
  ansible.builtin.command: cloud-init status --wait
  register: cloud_init
  changed_when: false
  # Exit code 2 means it finished with warnings only, which is fine here.
  failed_when: cloud_init.rc not in [0, 2]

- name: Load the kernel modules pod networking needs, at every boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: "overlay\nbr_netfilter\n"
    mode: "0644"

- name: Load them now
  ansible.builtin.command: "modprobe {{ item }}"
  loop: [overlay, br_netfilter]
  changed_when: false

- name: Let bridged traffic through iptables, and forward packets between pods
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"

- name: Apply them now
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Turn swap off, because the kubelet won't start with it by default
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Name every lab node in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[item].ansible_host }} {{ item }}"
  loop: "{{ groups['all'] }}"
