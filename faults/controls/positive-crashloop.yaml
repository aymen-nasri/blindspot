id: positive-crashloop
number: 0
name: 'Positive control: a crash the defaults should catch'
class: control
runs_on:
- kind
window_minutes: 30
inject:
- type: deployment-patch
  params:
    namespace: shop
    name: web
    patch:
      spec:
        template:
          spec:
            containers:
            - name: web
              command:
              - sh
              - -c
              - exit 1
harm:
  probe: web
relevant:
- alertname: Kube(Pod|Deployment|Container|ReplicaSet).*
  labels:
    namespace: shop
expect: caught
why: If this isn't caught, the tool is broken, not the monitoring.
