id: containerd-stopped
number: 23
name: containerd stopped, then the app crashes
class: harm
runs_on:
- vm
# KubeNodeNotReady, the slowest rule naming the cause, waits 15 minutes.
window_minutes: 30
inject:
- type: node-stop-service
  params:
    node: blindspot-worker
    service: containerd
# The app crashes during the outage, and nothing can restart it until containerd is back.
- type: node-kill-app
  params:
    namespace: shop
    app: web
harm:
  probe: web
  within_minutes: 10
relevant:
- alertname: .*
  labels:
    namespace: shop
- alertname: KubeNode(NotReady|Unreachable)
- alertname: Kubelet.*
- alertname: NodeSystemdService.*
why: The container runtime stops on the web app's node, then the app crashes. Running containers keep going on their
  own, so the outage alone is harmless, as v0.3 showed, until something needs to start. A crashed container can't be
  restarted until containerd is back, and the kubelet, which pauses its work while the runtime is down, may not even
  mark the pods unready.
