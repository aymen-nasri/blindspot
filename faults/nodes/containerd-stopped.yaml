id: containerd-stopped
number: 23
name: containerd stopped, then a rollout
class: harm
runs_on:
- vm
# KubeNodeNotReady, the slowest rule naming the cause, waits 15 minutes.
window_minutes: 30
inject:
- type: node-stop-service
  params:
    node: blindspot-worker
    service: containerd
# A rollout during the outage: the old pods leave the Service, and the new ones can't start.
- type: deployment-patch
  params:
    namespace: shop
    name: web
    patch:
      spec:
        template:
          metadata:
            annotations:
              blindspot/rollout: during-containerd-outage
harm:
  probe: web
  within_minutes: 10
relevant:
- alertname: .*
  labels:
    namespace: shop
- alertname: KubeNode(NotReady|Unreachable)
- alertname: Kubelet.*
- alertname: NodeSystemdService.*
why: The container runtime stops on the web app's node, then a routine rollout starts. Running containers keep going
  on their own, so the outage is harmless until something needs to start. The rollout takes the old pods out of the
  Service, and the new ones can't start until containerd is back.
