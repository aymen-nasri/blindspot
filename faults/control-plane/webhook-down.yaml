id: webhook-down
number: 25
name: Admission webhook down
class: harm
runs_on:
- kind
window_minutes: 30
inject:
- type: apply
  params:
    manifest:
      apiVersion: admissionregistration.k8s.io/v1
      kind: ValidatingWebhookConfiguration
      metadata:
        name: blindspot-broken
      webhooks:
      - name: broken.blindspot.test
        admissionReviewVersions:
        - v1
        sideEffects: None
        failurePolicy: Fail
        timeoutSeconds: 5
        clientConfig:
          service:
            name: missing
            namespace: default
            path: /validate
            port: 443
        rules:
        - operations:
          - CREATE
          - UPDATE
          apiGroups:
          - ''
          apiVersions:
          - v1
          resources:
          - pods
        namespaceSelector:
          matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values:
            - kube-system
harm:
  probe: api
relevant:
- alertname: KubeAPI.*|KubeClientErrors
- alertname: .*
  labels:
    namespace: shop
why: A validating webhook with failurePolicy Fail points at a service that doesn't exist, so no pod can be created
  outside kube-system.
