id: dns-slow
number: 9
name: DNS very slow
class: harm
runs_on:
- kind
window_minutes: 30
inject:
- type: corefile-block
  params:
    block: "example.com:53 {\n    errors\n    prometheus :9153\n    erratic {\n        delay 1 5s\n    }\n}\n"
harm:
  probe: web
  p95_ms: 1500
relevant:
- alertname: CoreDNS.*|KubeDNS.*
- alertname: .*
  labels:
    job: coredns|kube-dns
why: Every lookup of the outside name takes 5 seconds, longer than the client waits. Uses CoreDNS's erratic plugin.
